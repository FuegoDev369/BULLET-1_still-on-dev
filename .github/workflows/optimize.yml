# ╔══════════════════════════════════════════════════════════════════╗
# ║         BULLET-1 — Optimisation + Notifications CI/CD           ║
# ║                                                                  ║
# ║  Déclencher : onglet Actions → Run workflow                     ║
# ║                                                                  ║
# ║  Secrets GitHub requis (Settings → Secrets → Actions) :         ║
# ║    Telegram : TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID             ║
# ║    Discord  : DISCORD_WEBHOOK_URL                               ║
# ║  → Si un secret est absent, ce canal est silencieusement ignoré ║
# ╚══════════════════════════════════════════════════════════════════╝

name: 🎯 BULLET-1 — Optimisation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase d'optimisation"
        required: true
        type: choice
        default: "2a"
        options:
          - "2a"
          - "2b"
          - "2c"
          - "all"
      config_file:
        description: "Fichier de config (relatif à la racine)"
        required: false
        default: "config/config.json"
      save_top_n:
        description: "Nombre de top configs à sauvegarder (1-20)"
        required: false
        default: "10"
      notifications:
        description: "Niveau de notifications"
        required: false
        type: choice
        default: "all"
        options:
          - "all"
          - "start_end"
          - "off"

concurrency:
  group: bullet1-optimize-${{ github.ref }}
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  NOTIFY_MODE:         ${{ inputs.notifications }}
  RESULTS_DIR:         results/optimization
  PHASE:               ${{ inputs.phase }}
  CONFIG_FILE:         ${{ inputs.config_file }}
  TOP_N:               ${{ inputs.save_top_n }}

jobs:
  optimize:
    name: "Phase ${{ inputs.phase }} — Grid Search"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📥 Checkout (+ Git LFS pour la DB)
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🗄️ Vérifier la base de données
        run: |
          if [ ! -f "data/bullet1_market_data.db" ]; then
            echo "❌ data/bullet1_market_data.db introuvable !"
            exit 1
          fi
          echo "✅ DB trouvée — $(du -sh data/bullet1_market_data.db | cut -f1)"

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Installer les dépendances
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: 🔧 Préparer les scripts
        run: |
          chmod +x scripts/notify.sh
          mkdir -p results/optimization

      - name: ⚙️ Paramétrage config (save_top_n)
        run: |
          python3 - << 'EOF'
          import json
          cfg_path = "${{ env.CONFIG_FILE }}"
          top_n = int("${{ env.TOP_N }}")
          with open(cfg_path) as f:
              cfg = json.load(f)
          cfg.setdefault("optimization", {}).setdefault("output", {})["save_top_n_configs"] = top_n
          with open(cfg_path, "w") as f:
              json.dump(cfg, f, indent=2)
          print(f"✅ save_top_n_configs = {top_n}")
          EOF

      # ── 🔔 Notification : Démarrage ──────────────────────────────
      - name: 🔔 Notification — Démarrage
        if: env.NOTIFY_MODE != 'off'
        run: |
          bash scripts/notify.sh start \
            "${{ env.PHASE }}" \
            "${{ env.CONFIG_FILE }}" \
            "${{ env.TOP_N }}"

      # ── 🚀 OPTIMISATION ──────────────────────────────────────────
      - name: 🚀 Optimisation — Phase ${{ inputs.phase }}
        id: optimization
        run: |
          echo "════════════════════════════════════════════"
          echo "  BULLET-1 Optimizer"
          echo "  Phase    : ${{ env.PHASE }}"
          echo "  Config   : ${{ env.CONFIG_FILE }}"
          echo "  Runner   : $(uname -m) | $(nproc) CPUs | $(free -h | awk '/^Mem:/{print $2}') RAM"
          echo "  Démarrage: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "════════════════════════════════════════════"
          python3 optimize.py \
            --phase "${{ env.PHASE }}" \
            --config "${{ env.CONFIG_FILE }}" \
            --non-interactive
          echo "✅ Terminé : $(date '+%Y-%m-%d %H:%M:%S UTC')"

      # ── 📊 Parser les résultats ───────────────────────────────────
      - name: 📊 Parser les résultats
        id: results
        if: always() && steps.optimization.outcome != 'skipped'
        run: |
          python3 scripts/parse_results.py \
            --results-dir "${{ env.RESULTS_DIR }}" \
            --phase "${{ env.PHASE }}" \
            --mode best

      # ── 🔔 Notification : Résumé final ────────────────────────────
      - name: 🔔 Notification — Résumé final
        if: success() && env.NOTIFY_MODE != 'off'
        env:
          BEST_CONFIG: ${{ steps.results.outputs.best_config_name }}
          BEST_SHARPE: ${{ steps.results.outputs.best_sharpe }}
          BEST_PF:     ${{ steps.results.outputs.best_pf }}
          BEST_WR:     ${{ steps.results.outputs.best_wr }}
          BEST_DD:     ${{ steps.results.outputs.best_dd }}
          BEST_TRADES: ${{ steps.results.outputs.best_trades }}
        run: |
          bash scripts/notify.sh final_summary \
            "${{ env.PHASE }}" \
            "${BEST_CONFIG:-N/A}" \
            "${BEST_SHARPE:-N/A}" \
            "${BEST_PF:-N/A}" \
            "${BEST_WR:-N/A}" \
            "${BEST_DD:-N/A}" \
            "${BEST_TRADES:-N/A}"

      # ── 🔔 Notification : Erreur ──────────────────────────────────
      - name: 🔔 Notification — Erreur
        if: failure() && env.NOTIFY_MODE != 'off'
        run: |
          bash scripts/notify.sh error \
            "${{ env.PHASE }}" \
            "Consulter les logs du run GitHub Actions" \
            "optimize.py"

      # ── 📁 Upload Artifact ────────────────────────────────────────
      - name: 📁 Upload Artifact
        if: always() && steps.optimization.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: "results-phase-${{ env.PHASE }}-run${{ github.run_number }}"
          path: results/optimization/
          retention-days: 30
          if-no-files-found: warn

      # ── 💾 Commit & Push ──────────────────────────────────────────
      - name: 💾 Commit & Push résultats
        id: git_push
        if: success()
        run: |
          git config user.name  "BULLET-1 Actions Bot"
          git config user.email "bullet1-bot@github-actions"
          git add results/ config/config.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ️ Aucun changement à committer."
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M UTC')
            git commit -m "🤖 [Actions] Optimisation Phase ${{ env.PHASE }} — $TIMESTAMP

          Run #${{ github.run_number }} | Lancé par : ${{ github.actor }}
          Top ${{ env.TOP_N }} configs sauvegardées"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Résultats pushés → git pull pour récupérer"
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      # ── 📋 Résumé GitHub ──────────────────────────────────────────
      - name: 📋 Résumé du run
        if: always()
        env:
          BEST_CONFIG: ${{ steps.results.outputs.best_config_name }}
          BEST_SHARPE: ${{ steps.results.outputs.best_sharpe }}
          BEST_PF:     ${{ steps.results.outputs.best_pf }}
          BEST_WR:     ${{ steps.results.outputs.best_wr }}
          BEST_DD:     ${{ steps.results.outputs.best_dd }}
          BEST_TRADES: ${{ steps.results.outputs.best_trades }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## 🎯 BULLET-1 — Phase ${{ env.PHASE }} — Run #${{ github.run_number }}

          | Paramètre | Valeur |
          |-----------|--------|
          | **Phase** | ${{ env.PHASE }} |
          | **Config** | ${{ env.CONFIG_FILE }} |
          | **Top N** | ${{ env.TOP_N }} |
          | **Lancé par** | ${{ github.actor }} |
          | **Statut** | ${{ job.status }} |

          ### 🏆 Meilleure configuration

          | Métrique | Valeur |
          |----------|--------|
          | Config | \`${BEST_CONFIG:-N/A}\` |
          | Sharpe Ratio | ${BEST_SHARPE:-N/A} |
          | Profit Factor | ${BEST_PF:-N/A} |
          | Win Rate | ${BEST_WR:-N/A}% |
          | Max Drawdown | ${BEST_DD:-N/A}% |
          | Total Trades | ${BEST_TRADES:-N/A} |

          ### 💾 Récupérer les résultats
          \`\`\`bash
          git pull
          \`\`\`
          SUMMARY
